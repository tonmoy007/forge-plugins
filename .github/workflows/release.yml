name: release

# Publishes a version tag + GitHub release server-side. This exists because some
# managed/proxied environments return HTTP 403 on tag-ref pushes (branch pushes
# still work), which blocks `git push origin vX.Y.Z`. Dispatching this workflow
# lets the Actions runner — which talks to GitHub directly — create the tag and
# release from the already-merged release commit on main.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.4.1)"
        required: true
      target:
        description: "Commit SHA or ref to tag (the release commit on main)"
        required: true
      title:
        description: "Release title (defaults to the tag, e.g. v0.6.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog section for this version
        id: notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Pull the lines between "## [VERSION]" and the next "## [" heading.
          awk -v ver="## [${VERSION}]" '
            $0 ~ "^## \\[" {
              if (inblock) { exit }
              if (index($0, ver) == 1) { inblock=1; print; next }
            }
            inblock { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for ${VERSION}; using a default body." >&2
            printf 'Forge %s\n' "$TAG" > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          # Title defaults to the tag when the optional `title` input is omitted, so the
          # release name is never a stale hard-coded theme. Read from an env var (never inline
          # ${{ }}) so a dispatcher-supplied title can't inject into the shell.
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "${TITLE:-$TAG}" \
            --notes-file release-notes.md
          echo "Created release $TAG at $TARGET (title: ${TITLE:-$TAG})"
