name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate plugin.json
        run: python scripts/validate-plugin.py
        # T-001 must land before this passes

      - name: Enable subprocess coverage
        # Many tests exercise scripts by running them as subprocesses, which
        # coverage.py cannot see unless each child Python starts coverage
        # itself. This .pth does exactly that whenever COVERAGE_PROCESS_START is
        # set, lifting the measured number from ~52% to the real ~73%.
        run: |
          SITEPKG=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "import coverage; coverage.process_startup()" > "$SITEPKG/forge-subprocess-cov.pth"

      - name: Run unit tests + coverage gate
        # Single instrumented run: in-process + subprocess coverage measures
        # ~73%; the gate sits at 70 for a small buffer. (Previously a stale
        # `continue-on-error` no-op parked on "becomes hard fail after T-013".)
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: pytest tests/unit/ -v --cov=hooks --cov=scripts --cov-report=term-missing --cov-config=.coveragerc --cov-fail-under=70

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        run: pytest tests/integration/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m compileall hooks/ scripts/ -q

      - name: Validate Markdown
        run: |
          # Future: add markdownlint or similar
          echo "Markdown linting not yet configured"
