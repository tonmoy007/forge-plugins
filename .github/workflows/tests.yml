name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate plugin.json
        run: python scripts/validate-plugin.py
        # T-001 must land before this passes

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=hooks --cov=scripts --cov-report=term-missing

      - name: Coverage threshold
        run: pytest tests/unit/ --cov=hooks --cov=scripts --cov-fail-under=80
        continue-on-error: true   # Becomes hard fail after T-013

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        run: pytest tests/integration/ -v
        continue-on-error: true   # Becomes hard fail after M2 lands

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m compileall hooks/ scripts/ -q

      - name: Validate Markdown
        run: |
          # Future: add markdownlint or similar
          echo "Markdown linting not yet configured"
