<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a" />
      <stop offset="50%" style="stop-color:#12122a" />
      <stop offset="100%" style="stop-color:#1a0a2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c63ff" />
      <stop offset="50%" style="stop-color:#e94560" />
      <stop offset="100%" style="stop-color:#ff6b35" />
    </linearGradient>
    <filter id="glow-subtle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="box-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a3a" />
      <stop offset="100%" style="stop-color:#150d1f" />
    </linearGradient>
    <linearGradient id="box-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a" />
      <stop offset="100%" style="stop-color:#0d1f15" />
    </linearGradient>
    <linearGradient id="box-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a4a" />
      <stop offset="100%" style="stop-color:#0d1525" />
    </linearGradient>
    <linearGradient id="box-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a2a1a" />
      <stop offset="100%" style="stop-color:#1f150d" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3a" stop-opacity="0.6" />
      <stop offset="100%" style="stop-color:#0a0a1a" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="test-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c63ff" />
      <stop offset="50%" style="stop-color:#00c853" />
      <stop offset="100%" style="stop-color:#00e676" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)" />
  <rect width="1280" height="640" fill="url(#grid)" />

  <!-- Decorative glow circles -->
  <circle cx="150" cy="150" r="200" fill="#6c63ff" opacity="0.06" filter="url(#glow-subtle)" />
  <circle cx="1100" cy="500" r="250" fill="#e94560" opacity="0.05" filter="url(#glow-subtle)" />
  <circle cx="640" cy="320" r="300" fill="#6c63ff" opacity="0.03" filter="url(#glow-subtle)" />

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)" />

  <!-- Logo mark -->
  <rect x="60" y="60" width="48" height="48" rx="12" fill="url(#accent)" opacity="0.9" />
  <text x="72" y="92" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#ffffff">F</text>
  <text x="125" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#e0e0e0">Forge</text>

  <!-- Tagline -->
  <text x="60" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">SDLC Orchestrator</text>
  <text x="60" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="url(#accent)" letter-spacing="-1">for Claude Code</text>

  <!-- Subtitle -->
  <text x="60" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8888aa" font-weight="400">Deterministic gates · Hands-off autopilot · Self-improving skills</text>

  <!-- Install pill -->
  <rect x="60" y="295" width="620" height="46" rx="23" fill="#1a1a3a" stroke="#3a3a6a" stroke-width="1" />
  <text x="80" y="323" font-family="ui-monospace, 'SF Mono', monospace" font-size="15" fill="#6c63ff">$</text>
  <text x="96" y="323" font-family="ui-monospace, 'SF Mono', monospace" font-size="15" fill="#a0a0cc">/plugin marketplace add tonmoy007/forge-plugins</text>

  <!-- Stats pills -->
  <rect x="60" y="365" width="175" height="34" rx="17" fill="none" stroke="#2a2a5a" stroke-width="1" />
  <text x="80" y="387" font-family="ui-monospace, monospace" font-size="13" fill="#4ade80">●</text>
  <text x="96" y="387" font-family="-apple-system, sans-serif" font-size="13" fill="#8888aa">1,610+ tests passing</text>

  <rect x="255" y="365" width="110" height="34" rx="17" fill="none" stroke="#2a2a5a" stroke-width="1" />
  <text x="275" y="387" font-family="ui-monospace, monospace" font-size="13" fill="#6c63ff">●</text>
  <text x="291" y="387" font-family="-apple-system, sans-serif" font-size="13" fill="#8888aa">18 agents</text>

  <rect x="380" y="365" width="110" height="34" rx="17" fill="none" stroke="#2a2a5a" stroke-width="1" />
  <text x="400" y="387" font-family="ui-monospace, monospace" font-size="13" fill="#e94560">●</text>
  <text x="416" y="387" font-family="-apple-system, sans-serif" font-size="13" fill="#8888aa">12 stages</text>

  <rect x="505" y="365" width="130" height="34" rx="17" fill="none" stroke="#2a2a5a" stroke-width="1" />
  <text x="525" y="387" font-family="ui-monospace, monospace" font-size="13" fill="#ff6b35">●</text>
  <text x="541" y="387" font-family="-apple-system, sans-serif" font-size="13" fill="#8888aa">33 skills</text>

  <!-- Pipeline section -->
  <text x="60" y="470" font-family="ui-monospace, monospace" font-size="11" fill="#555577" letter-spacing="2">12-STAGE PIPELINE</text>

  <!-- Pipeline stages -->
  <rect x="60" y="488" width="100" height="56" rx="8" fill="url(#box-purple)" stroke="#6c63ff" stroke-width="1.5" />
  <text x="110" y="512" font-family="ui-monospace, monospace" font-size="11" fill="#b0b0d0" text-anchor="middle">Requirements</text>
  <text x="110" y="530" font-family="ui-monospace, monospace" font-size="9" fill="#6c63ff" text-anchor="middle">Stage 1</text>
  <text x="165" y="523" font-family="ui-monospace, monospace" font-size="16" fill="#3a3a6a">→</text>

  <rect x="185" y="488" width="100" height="56" rx="8" fill="url(#box-green)" stroke="#4ade80" stroke-width="1.5" />
  <text x="235" y="512" font-family="ui-monospace, monospace" font-size="11" fill="#b0d0b0" text-anchor="middle">Product Design</text>
  <text x="235" y="530" font-family="ui-monospace, monospace" font-size="9" fill="#4ade80" text-anchor="middle">Stage 2</text>
  <text x="290" y="523" font-family="ui-monospace, monospace" font-size="16" fill="#3a3a6a">→</text>

  <rect x="310" y="488" width="100" height="56" rx="8" fill="url(#box-blue)" stroke="#4488ff" stroke-width="1.5" />
  <text x="360" y="512" font-family="ui-monospace, monospace" font-size="11" fill="#a0b0d0" text-anchor="middle">Architecture</text>
  <text x="360" y="530" font-family="ui-monospace, monospace" font-size="9" fill="#4488ff" text-anchor="middle">Stage 3</text>
  <text x="415" y="523" font-family="ui-monospace, monospace" font-size="16" fill="#3a3a6a">→</text>

  <rect x="435" y="488" width="100" height="56" rx="8" fill="url(#box-orange)" stroke="#ff6b35" stroke-width="1.5" />
  <text x="485" y="512" font-family="ui-monospace, monospace" font-size="11" fill="#d0b0a0" text-anchor="middle">Build</text>
  <text x="485" y="530" font-family="ui-monospace, monospace" font-size="9" fill="#ff6b35" text-anchor="middle">Stage 4+</text>
  <text x="540" y="523" font-family="ui-monospace, monospace" font-size="16" fill="#3a3a6a">→</text>

  <!-- Gate lock -->
  <rect x="560" y="498" width="36" height="36" rx="18" fill="none" stroke="#e94560" stroke-width="2" />
  <text x="568" y="521" font-family="ui-monospace, monospace" font-size="18" fill="#e94560">G</text>
  <text x="601" y="523" font-family="ui-monospace, monospace" font-size="16" fill="#3a3a6a">→</text>

  <rect x="621" y="488" width="100" height="56" rx="8" fill="url(#box-purple)" stroke="#a855f7" stroke-width="1.5" />
  <text x="671" y="512" font-family="ui-monospace, monospace" font-size="11" fill="#c0a0d0" text-anchor="middle">Review</text>
  <text x="671" y="530" font-family="ui-monospace, monospace" font-size="9" fill="#a855f7" text-anchor="middle">Gate</text>
  <text x="726" y="523" font-family="ui-monospace, monospace" font-size="16" fill="#3a3a6a">→</text>

  <rect x="746" y="488" width="100" height="56" rx="8" fill="url(#box-green)" stroke="#00c853" stroke-width="1.5" />
  <text x="796" y="512" font-family="ui-monospace, monospace" font-size="11" fill="#a0d0b0" text-anchor="middle">Release</text>
  <text x="796" y="530" font-family="ui-monospace, monospace" font-size="9" fill="#00c853" text-anchor="middle">Stage 12</text>
  <text x="851" y="523" font-family="ui-monospace, monospace" font-size="16" fill="#3a3a6a">···</text>

  <!-- Feature Card 1: Gates -->
  <rect x="870" y="80" width="350" height="90" rx="12" fill="url(#card-bg)" stroke="#2a2a5a" stroke-width="1" />
  <rect x="870" y="80" width="350" height="3" rx="2" fill="#e94560" />
  <text x="895" y="115" font-family="ui-monospace, monospace" font-size="12" fill="#e94560" font-weight="700">GATED PIPELINE</text>
  <text x="895" y="140" font-family="-apple-system, sans-serif" font-size="14" fill="#a0a0c0">Nothing advances until the</text>
  <text x="895" y="158" font-family="-apple-system, sans-serif" font-size="14" fill="#a0a0c0">current stage's gate passes.</text>

  <!-- Feature Card 2 -->
  <rect x="870" y="185" width="350" height="90" rx="12" fill="url(#card-bg)" stroke="#2a2a5a" stroke-width="1" />
  <rect x="870" y="185" width="350" height="3" rx="2" fill="#6c63ff" />
  <text x="895" y="220" font-family="ui-monospace, monospace" font-size="12" fill="#6c63ff" font-weight="700">REQ-ID TRACEABILITY</text>
  <text x="895" y="245" font-family="-apple-system, sans-serif" font-size="14" fill="#a0a0c0">Every artifact &amp; test links to</text>
  <text x="895" y="263" font-family="-apple-system, sans-serif" font-size="14" fill="#a0a0c0">a numbered REQ-ID end to end.</text>

  <!-- Feature Card 3 -->
  <rect x="870" y="290" width="350" height="90" rx="12" fill="url(#card-bg)" stroke="#2a2a5a" stroke-width="1" />
  <rect x="870" y="290" width="350" height="3" rx="2" fill="#00c853" />
  <text x="895" y="325" font-family="ui-monospace, monospace" font-size="12" fill="#00c853" font-weight="700">COST-CAPPED ORCHESTRATION</text>
  <text x="895" y="350" font-family="-apple-system, sans-serif" font-size="14" fill="#a0a0c0">Background agents run within</text>
  <text x="895" y="368" font-family="-apple-system, sans-serif" font-size="14" fill="#a0a0c0">configurable daily/monthly budgets.</text>

  <!-- Feature Card 4 -->
  <rect x="870" y="395" width="350" height="90" rx="12" fill="url(#card-bg)" stroke="#2a2a5a" stroke-width="1" />
  <rect x="870" y="395" width="350" height="3" rx="2" fill="#ff6b35" />
  <text x="895" y="430" font-family="ui-monospace, monospace" font-size="12" fill="#ff6b35" font-weight="700">BROWNFIELD ADOPTION</text>
  <text x="895" y="455" font-family="-apple-system, sans-serif" font-size="14" fill="#a0a0c0">Works on existing projects —</text>
  <text x="895" y="473" font-family="-apple-system, sans-serif" font-size="14" fill="#a0a0c0">detects type, infers SRS, seeds state.</text>

  <!-- Bottom bar -->
  <rect x="60" y="580" width="1160" height="1" fill="#2a2a5a" />
  <text x="60" y="610" font-family="-apple-system, sans-serif" font-size="13" fill="#555577">Install: /plugin marketplace add tonmoy007/forge-plugins  ·  /plugin install forge@forge-plugins</text>
  <text x="900" y="610" font-family="-apple-system, sans-serif" font-size="13" fill="#555577">github.com/tonmoy007/forge-plugins</text>

  <!-- Test bar -->
  <rect x="60" y="556" width="280" height="8" rx="4" fill="#1a1a3a" />
  <rect x="60" y="556" width="200" height="8" rx="4" fill="url(#test-bar)" />
  <text x="350" y="564" font-family="ui-monospace, monospace" font-size="11" fill="#4ade80">70%+ coverage</text>

  <!-- Bottom accent -->
  <rect x="0" y="636" width="1280" height="4" fill="url(#accent)" />
</svg>